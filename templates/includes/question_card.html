{% load static %}
<div class="card mb-3">
    <div class="card-body d-flex">
        <img src="{% static question.avatar %}" alt="Avatar" width="64" height="64" class="rounded me-3">
        <div class="flex-grow-1">
            <h5>
                <a class="question-title" href="{% url 'question' question.id %}">{{ question.title }}</a>
            </h5>
            <p class="text-muted">{{ question.text }}</p>
            <div class="mb-2">
                {% for tag in question.tags %}
                    <a href="{% url 'tag' tag %}" class="badge bg-secondary text-decoration-none">{{ tag }}</a>
                {% endfor %}
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">Author: {{ question.author }}</small>
                <div>
                    <span class="me-3">Answers: {{ question.answers_count }}</span>
                    <button class="btn btn-sm btn-outline-success">▲</button>
                    <span class="mx-1">{{ question.votes }}</span>
                    <button class="btn btn-sm btn-outline-danger">▼</button>
                </div>
            </div>
        </div>
    </div>
</div>
