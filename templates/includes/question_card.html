{% load static %}
<div class="card mb-3">
    <div class="card-body d-flex">
        <img src="{{ question.author.profile.avatar_url }}" alt="Avatar" width="64" height="64" class="rounded me-3">
        <div class="flex-grow-1">
            <h5>
                <a class="question-title" href="{% url 'question' question.id %}">{{ question.title }}</a>
            </h5>
            <p class="text-muted">{{ question.text }}</p>
            <div class="mb-2">
                {% for tag in question.tags.all %}
                    <a href="{% url 'tag' tag.name %}" class="badge bg-secondary text-decoration-none">{{ tag.name }}</a>
                {% endfor %}
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">Author: {{ question.author.username }}</small>
                <div>
                    <span class="me-3">Answers: {{ question.answers_count }}</span>
                    <button class="btn btn-sm btn-outline-success js-question-vote" data-question-id="{{ question.id }}" data-value="1" {% if not user.is_authenticated or question.id in question_liked_ids %}disabled title="Log in to vote."{% endif %}>▲</button>
                    <span class="mx-1 js-question-rating" data-question-id="{{ question.id }}">{{ question.rating }}</span>
                    <button class="btn btn-sm btn-outline-danger js-question-vote" data-question-id="{{ question.id }}" data-value="-1" {% if not user.is_authenticated or question.id in question_disliked_ids %}disabled title="Log in to vote."{% endif %}>▼</button>
                </div>
            </div>
        </div>
    </div>
</div>
