<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Profile - Deltarune Forum</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <div class="container d-flex align-items-center justify-content-between flex-wrap">
                <a href="index.html" class="site-title">
                    DELTARUNE FORUM
                </a>
                <form class="site-search d-flex flex-grow-1 mx-3">
                    <input class="form-control me-2" placeholder="Search...">
                    <button class="btn btn-outline-primary">Search</button>
                </form>
                <a href="login.html" class="btn btn-outline-secondary btn-sm">Login</a>
            </div>
        </header>
        <div class="container flex-grow-1 mt-4">
            <div class="row">
                <main class="col-lg-8 col-md-12">
                    <h2 class="mb-4">Profile Settings</h2>
                    <div class="card">
                        <div class="card-body">
                            <div class="alert alert-danger d-none">
                                Something went wrong. Please try again.
                            </div>
                            <form>
                                <div class="row">
                                    <div class="col-md-4 text-center mb-4">
                                        <img src="/static/img/avatar.png" class="rounded-circle mb-3" width="120" height="120">
                                        <div>
                                            <input type="file" class="form-control">
                                        </div>
                                    </div>
                                    <div class="col-md-8">
                                        <div class="mb-3">
                                            <label class="form-label">Username</label>
                                            <input type="text" class="form-control" value="User123">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" value="user@email.com">
                                            <div class="text-danger small">
                                                Invalid email format
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">New Password</label>
                                            <input type="password" class="form-control">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Repeat Password</label>
                                            <input type="password" class="form-control">
                                        </div>
                                        <button class="btn btn-primary">
                                            Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </main>
                <aside class="col-lg-4 col-md-12 mt-4 mt-lg-0">
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>Popular tags</h5>
                            <div>
                                <span class="badge bg-primary">Deltarune</span>
                                <span class="badge bg-secondary">Undertale</span>
                                <span class="badge bg-success">GameDev</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <h5>Best members</h5>
                            <ul class="list-unstyled mb-0">
                                <li><a href="#">Kris</a></li>
                                <li><a href="#">Susie</a></li>
                                <li><a href="#">Ralsei</a></li>
                                <li><a href="#">Lancer</a></li>
                            </ul>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
        <footer class="mt-auto">
            <div class="container text-center py-3">
                <span class="text-muted">© 2026 Deltarune developed by TobyFox.</span>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
