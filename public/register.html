<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Deltarune Forum</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <div class="container d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <a href="index.html" class="site-title">
                        DELTARUNE FORUM
                    </a>
                </div>
            </div>
        </header>
        <div class="container flex-grow-1 mt-4">
            <div class="row">
                <main class="col-lg-6 col-md-8 mx-auto">
                    <h2 class="mb-4 text-center">Sign Up</h2>
                    <div class="card">
                        <div class="card-body">
                            <div class="alert alert-danger d-none">
                                Please fix the errors below
                            </div>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" placeholder="Enter username">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Enter email">

                                    <div class="text-danger small">
                                        Invalid email
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Repeat password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Avatar</label>
                                    <input type="file" class="form-control">
                                </div>
                                <button class="btn btn-success w-100 mb-3">
                                    Create account
                                </button>
                                <div class="text-center">
                                    <span class="auth-prompt">Already have an account?</span>
                                    <a class="auth-prompt" href="login.html">Login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <footer class="mt-auto">
            <div class="container text-center py-3">
                <span class="text-muted">© 2026 Deltarune developed by TobyFox.</span>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="static/js/script.js"></script>
    </body>
</html>
