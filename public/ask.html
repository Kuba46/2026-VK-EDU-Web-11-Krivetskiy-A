<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Ask Question - Deltarune Forum</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <div class="container d-flex align-items-center justify-content-between flex-wrap">
                <a href="index.html" class="site-title">
                    DELTARUNE FORUM
                </a>
                <form class="site-search d-flex flex-grow-1 mx-3">
                    <input class="form-control me-2" placeholder="Search...">
                    <button class="btn btn-outline-primary">Search</button>
                </form>
                <a href="login.html" class="btn btn-outline-secondary btn-sm">Login</a>
            </div>
        </header>
        <div class="container flex-grow-1 mt-4">
            <div class="row">
                <main class="col-lg-8 col-md-12">
                    <h2 class="mb-4">Ask a Question</h2>
                    <div class="card">
                        <div class="card-body">
                            <div class="alert alert-danger">
                                Please fill in all required fields.
                            </div>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Title</label>
                                    <input type="text" class="form-control" placeholder="Enter a short and clear title">

                                    <div class="form-text">
                                        Max 100 characters
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Question</label>
                                    <textarea class="form-control" rows="5" placeholder="Describe your problem in detail"></textarea>

                                    <div class="form-text">
                                        Provide as much detail as possible
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tags</label>
                                    <input type="text" class="form-control" placeholder="e.g. python django web">
                                    <div class="form-text">
                                        Separate tags with spaces (max 5 tags)
                                    </div>
                                </div>
                                <button class="btn btn-success">
                                    Ask Question
                                </button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <footer class="mt-auto">
            <div class="container">
                <span class="text-muted">© 2026 Deltarune developed by TobyFox.</span>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
